<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Blood Requisition | LifeLink</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/custom.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <div id="navbar-mount"></div>

    <main class="container py-4 flex-grow-1 d-flex justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm p-4 bg-white">
                <div class="d-flex align-items-center gap-2 mb-3 pb-3 border-bottom">
                    <i class="bi bi-clipboard2-plus-fill text-danger fs-3"></i>
                    <div>
                        <h4 class="fw-bold mb-0">Hospital Blood Requisition Form</h4>
                        <div class="text-muted small">Submit clinical demand for patient transfusion</div>
                    </div>
                </div>

                <form id="newRequestForm" onsubmit="handleCreateRequest(event)">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Patient Full Name <span class="text-danger">*</span></label>
                            <input type="text" id="patientName" class="form-control" placeholder="e.g. Farhana Ahmed" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Hospital Name & Department <span class="text-danger">*</span></label>
                            <input type="text" id="hospitalName" class="form-control" placeholder="e.g. Square Hospital - Surgery Dept" required>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Required Blood Group <span class="text-danger">*</span></label>
                            <select id="bloodGroupId" class="form-select" required>
                                <option value="">-- Choose Group --</option>
                                <option value="1">A+</option>
                                <option value="2">A-</option>
                                <option value="3">B+</option>
                                <option value="4">B-</option>
                                <option value="5">AB+</option>
                                <option value="6">AB-</option>
                                <option value="7">O+</option>
                                <option value="8">O-</option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Units Requested (Bags) <span class="text-danger">*</span></label>
                            <input type="number" id="unitsRequested" class="form-control" min="1" max="10" value="1" required>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Urgency Level <span class="text-danger">*</span></label>
                            <select id="urgency" class="form-select" required>
                                <option value="ROUTINE">Routine (Planned Procedure)</option>
                                <option value="URGENT">Urgent (Within 24 Hours)</option>
                                <option value="EMERGENCY">Critical Emergency (Immediate)</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Required Date <span class="text-danger">*</span></label>
                            <input type="date" id="requiredDate" class="form-control" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Clinical Indication / Diagnosis</label>
                            <input type="text" id="reason" class="form-control" placeholder="e.g. Scheduled elective surgery">
                        </div>

                        <div class="col-12 mt-4 pt-2 border-top d-flex justify-content-end gap-2">
                            <a href="requester_dashboard.html" class="btn btn-outline-secondary">Cancel</a>
                            <button type="submit" id="submitBtn" class="btn btn-danger fw-bold px-4">
                                <i class="bi bi-check2-circle me-1"></i>Submit Requisition
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <div id="footer-mount"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/navbar.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Default required date to today
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('requiredDate').value = today;

            // Check URL query parameters
            const params = new URLSearchParams(window.location.search);
            const bgId = params.get('blood_group_id');
            if (bgId) {
                document.getElementById('bloodGroupId').value = bgId;
            }
        });

        async function handleCreateRequest(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Submitting...`;

            const payload = {
                patient_name: document.getElementById('patientName').value.trim(),
                hospital_name: document.getElementById('hospitalName').value.trim(),
                blood_group_id: document.getElementById('bloodGroupId').value,
                units_requested: document.getElementById('unitsRequested').value,
                urgency: document.getElementById('urgency').value,
                required_date: document.getElementById('requiredDate').value,
                reason: document.getElementById('reason').value.trim()
            };

            try {
                const res = await apiRequest('requests.php?action=create', 'POST', payload);
                showToast(res.message, 'success');
                setTimeout(() => {
                    window.location.href = 'requester_dashboard.html';
                }, 700);
            } catch (err) {
                showToast(err.message, 'danger');
                btn.disabled = false;
                btn.innerHTML = `<i class="bi bi-check2-circle me-1"></i>Submit Requisition`;
            }
        }
    </script>
</body>
</html>
