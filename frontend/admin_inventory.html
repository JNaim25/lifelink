<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Inventory Management | LifeLink</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/custom.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <div id="navbar-mount"></div>

    <main class="container-fluid px-lg-4 py-4 flex-grow-1">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
                <h2 class="fw-bold mb-0 text-dark"><i class="bi bi-box-seam text-danger me-2"></i>Blood Bag Inventory Registry</h2>
                <p class="text-muted mb-0">Serialized bio-traceable units, cold-storage locations, and 35-day red cell preservation windows</p>
            </div>
            <button class="btn btn-danger fw-bold shadow-sm" data-bs-toggle="modal" data-bs-target="#addBagModal">
                <i class="bi bi-plus-circle me-1"></i>Add Blood Bag
            </button>
        </div>

        <!-- Filter & Search Bar -->
        <div class="card border-0 shadow-sm p-3 mb-4 bg-white">
            <div class="row g-2 align-items-center">
                <div class="col-md-3">
                    <input type="text" id="searchInput" class="form-control form-control-sm font-monospace" placeholder="Search bag code or shelf..." onkeyup="if(event.key === 'Enter') filterInventory()">
                </div>
                <div class="col-md-3">
                    <select id="filterBloodGroup" class="form-select form-select-sm" onchange="filterInventory()">
                        <option value="">All Blood Groups</option>
                        <option value="1">A+</option>
                        <option value="2">A-</option>
                        <option value="3">B+</option>
                        <option value="4">B-</option>
                        <option value="5">AB+</option>
                        <option value="6">AB-</option>
                        <option value="7">O+</option>
                        <option value="8">O-</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <select id="filterStatus" class="form-select form-select-sm" onchange="filterInventory()">
                        <option value="">All Statuses</option>
                        <option value="AVAILABLE">AVAILABLE (Viable)</option>
                        <option value="ISSUED">ISSUED (Transfused)</option>
                        <option value="DISCARDED">DISCARDED</option>
                    </select>
                </div>
                <div class="col-md-3 d-flex gap-2">
                    <button class="btn btn-primary btn-sm flex-fill fw-semibold" onclick="filterInventory()">
                        <i class="bi bi-funnel me-1"></i>Filter
                    </button>
                    <button class="btn btn-outline-secondary btn-sm" onclick="resetFilters()">Reset</button>
                </div>
            </div>
        </div>

        <!-- Inventory Table -->
        <div class="card border-0 shadow-sm bg-white">
            <div class="card-body p-0" id="inventoryMount">
                <div class="text-center py-5">
                    <div class="spinner-border text-danger" role="status"></div>
                    <div class="text-muted mt-2">Loading inventory records...</div>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal: Add New Blood Bag -->
    <div class="modal fade" id="addBagModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title fw-bold"><i class="bi bi-droplet-half me-2"></i>Register New Blood Bag</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="addBagForm" onsubmit="handleAddBagSubmit(event)">
                    <div class="modal-body p-4">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Serial Barcode / Bag Code (optional)</label>
                            <input type="text" id="newBagCode" class="form-control font-monospace" placeholder="Auto-generated if left blank">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Blood Group <span class="text-danger">*</span></label>
                            <select id="newBloodGroup" class="form-select" required>
                                <option value="">-- Choose Group --</option>
                                <option value="1">A+</option>
                                <option value="2">A-</option>
                                <option value="3">B+</option>
                                <option value="4">B-</option>
                                <option value="5">AB+</option>
                                <option value="6">AB-</option>
                                <option value="7">O+</option>
                                <option value="8">O-</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Collection Date <span class="text-danger">*</span></label>
                            <input type="date" id="newCollectionDate" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Chamber / Vault Storage Location <span class="text-danger">*</span></label>
                            <input type="text" id="newLocation" class="form-control" value="Cold Vault 1 / Shelf A1" required>
                        </div>
                    </div>
                    <div class="modal-footer bg-light">
                        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" id="addBagBtn" class="btn btn-danger fw-bold">Add to Inventory</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div id="footer-mount"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/journey_modal.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('newCollectionDate').value = new Date().toISOString().split('T')[0];
            loadInventory();
        });

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('filterBloodGroup').value = '';
            document.getElementById('filterStatus').value = '';
            loadInventory();
        }

        function filterInventory() {
            const search = document.getElementById('searchInput').value.trim();
            const bg = document.getElementById('filterBloodGroup').value;
            const status = document.getElementById('filterStatus').value;
            loadInventory(bg, status, search);
        }

        async function loadInventory(bloodGroupId = '', status = '', search = '') {
            const mount = document.getElementById('inventoryMount');
            let query = 'inventory.php?action=list';
            if (bloodGroupId) query += `&blood_group_id=${bloodGroupId}`;
            if (status) query += `&status=${status}`;
            if (search) query += `&search=${encodeURIComponent(search)}`;

            try {
                const res = await apiRequest(query);
                const items = res.data || [];

                if (items.length === 0) {
                    mount.innerHTML = `<div class="text-center py-5 text-muted small">No blood bags found matching filter criteria.</div>`;
                    return;
                }

                mount.innerHTML = `
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0 small">
                            <thead class="table-light">
                                <tr>
                                    <th>Serial Bag Code</th>
                                    <th>Blood Group</th>
                                    <th>Collection Date</th>
                                    <th>Expiry Date</th>
                                    <th>Shelf Remaining</th>
                                    <th>Storage Location</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${items.map(b => {
                                    let statusBadge = '';
                                    if (b.status === 'AVAILABLE') statusBadge = '<span class="badge bg-success">AVAILABLE</span>';
                                    else if (b.status === 'ISSUED') statusBadge = '<span class="badge bg-primary">ISSUED</span>';
                                    else if (b.status === 'DISCARDED') statusBadge = '<span class="badge bg-danger">DISCARDED</span>';
                                    else statusBadge = `<span class="badge bg-secondary">${b.status}</span>`;

                                    const isExpiringSoon = b.status === 'AVAILABLE' && b.days_left >= 0 && b.days_left <= 7;
                                    const isExpired = b.days_left < 0;

                                    let shelfDisplay = `${b.days_left} days`;
                                    if (isExpired) shelfDisplay = `<span class="text-danger fw-bold">EXPIRED</span>`;
                                    else if (isExpiringSoon) shelfDisplay = `<span class="text-warning fw-bold">${b.days_left} days (Warning)</span>`;

                                    return `
                                        <tr>
                                            <td>
                                                <span class="badge bg-light text-dark border barcode-badge" onclick="openJourneyModal('${b.bag_code}')">
                                                    ${b.bag_code}
                                                </span>
                                            </td>
                                            <td><span class="badge bg-dark fs-6">${b.blood_group}</span></td>
                                            <td>${b.collection_date}</td>
                                            <td>${b.expiry_date}</td>
                                            <td>${shelfDisplay}</td>
                                            <td><i class="bi bi-geo-alt text-muted me-1"></i>${b.storage_location}</td>
                                            <td>${statusBadge}</td>
                                            <td>
                                                <div class="d-flex gap-1">
                                                    <button class="btn btn-outline-secondary btn-sm py-0 px-2" onclick="openJourneyModal('${b.bag_code}')">
                                                        <i class="bi bi-arrow-repeat me-1"></i>Trace
                                                    </button>
                                                    ${b.status === 'AVAILABLE' ? `
                                                        <button class="btn btn-outline-danger btn-sm py-0 px-2" onclick="discardBag(${b.inventory_id}, '${b.bag_code}')">
                                                            Discard
                                                        </button>
                                                    ` : ''}
                                                </div>
                                            </td>
                                        </tr>
                                    `;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            } catch (err) {
                mount.innerHTML = `<div class="p-3 text-danger small">${err.message}</div>`;
            }
        }

        async function handleAddBagSubmit(e) {
            e.preventDefault();
            const btn = document.getElementById('addBagBtn');
            btn.disabled = true;

            const payload = {
                bag_code: document.getElementById('newBagCode').value.trim(),
                blood_group_id: document.getElementById('newBloodGroup').value,
                collection_date: document.getElementById('newCollectionDate').value,
                storage_location: document.getElementById('newLocation').value.trim()
            };

            try {
                const res = await apiRequest('inventory.php?action=add', 'POST', payload);
                showToast(res.message, 'success');
                bootstrap.Modal.getInstance(document.getElementById('addBagModal')).hide();
                document.getElementById('addBagForm').reset();
                document.getElementById('newCollectionDate').value = new Date().toISOString().split('T')[0];
                loadInventory();
            } catch (err) {
                showToast(err.message, 'danger');
            } finally {
                btn.disabled = false;
            }
        }

        async function discardBag(invId, code) {
            if (!confirm(`Mark unit ${code} as DISCARDED?`)) return;
            try {
                const res = await apiRequest('inventory.php?action=discard', 'POST', { inventory_id: invId });
                showToast(res.message, 'info');
                filterInventory();
            } catch (err) {
                showToast(err.message, 'danger');
            }
        }
    </script>
</body>
</html>
