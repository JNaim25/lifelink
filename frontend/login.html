<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | LifeLink Blood Bank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/custom.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <div id="navbar-mount"></div>

    <main class="container py-5 flex-grow-1 d-flex align-items-center justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-lg p-4">
                <div class="text-center mb-4">
                    <div class="d-inline-flex p-3 rounded-circle bg-danger-subtle text-danger mb-2">
                        <i class="bi bi-heart-pulse-fill fs-2"></i>
                    </div>
                    <h3 class="fw-bold mb-1">Welcome Back</h3>
                    <p class="text-muted small">Sign in to your LifeLink portal</p>
                </div>

                <!-- One-Click Demo Credentials Banner -->
                <div class="card bg-light border p-3 mb-4">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="small fw-bold text-dark"><i class="bi bi-key-fill text-warning me-1"></i>One-Click Demo Roles:</span>
                        <span class="badge bg-secondary">CSE 3522 Viva</span>
                    </div>
                    <div class="d-flex gap-2 flex-wrap">
                        <button type="button" class="btn btn-outline-danger btn-sm flex-fill" onclick="fillCredentials('admin@lifelink.org', 'Admin@123')">
                            Admin
                        </button>
                        <button type="button" class="btn btn-outline-success btn-sm flex-fill" onclick="fillCredentials('donor1@gmail.com', 'Password@123')">
                            Donor
                        </button>
                        <button type="button" class="btn btn-outline-primary btn-sm flex-fill" onclick="fillCredentials('requester1@hospital.org', 'Password@123')">
                            Requester
                        </button>
                    </div>
                </div>

                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-envelope text-muted"></i></span>
                            <input type="email" id="email" class="form-control" placeholder="name@domain.com" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-lock text-muted"></i></span>
                            <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                        </div>
                    </div>

                    <button type="submit" id="loginBtn" class="btn btn-danger btn-lg w-100 fw-bold shadow-sm">
                        Sign In
                    </button>
                </form>

                <div class="text-center mt-4 pt-3 border-top small text-muted">
                    Don't have an account? <a href="register.html" class="text-danger fw-bold">Register here</a>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-mount"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/navbar.js"></script>

    <script>
        function fillCredentials(email, password) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = password;
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Signing in...`;

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                const res = await apiRequest('auth.php?action=login', 'POST', { email, password });
                showToast(res.message, 'success');
                
                // Redirect based on role
                const role = res.data.role;
                setTimeout(() => {
                    if (role === 'ADMIN') {
                        window.location.href = 'admin_dashboard.html';
                    } else if (role === 'DONOR') {
                        window.location.href = 'donor_dashboard.html';
                    } else if (role === 'REQUESTER') {
                        window.location.href = 'requester_dashboard.html';
                    } else {
                        window.location.href = 'index.html';
                    }
                }, 500);
            } catch (err) {
                showToast(err.message, 'danger');
                btn.disabled = false;
                btn.innerHTML = `Sign In`;
            }
        }
    </script>
</body>
</html>
