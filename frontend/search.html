<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Blood Match | LifeLink</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/custom.css">
</head>
<body class="d-flex flex-column min-vh-100">

    <div id="navbar-mount"></div>

    <main class="container py-4 flex-grow-1">
        <div class="mb-4">
            <div class="d-flex align-items-center gap-2 mb-1">
                <i class="bi bi-crosshair text-danger fs-3"></i>
                <h2 class="fw-bold mb-0">Smart Blood Match</h2>
            </div>
            <p class="text-muted">
                Feature 1: Dynamic cross-matching algorithm calculating exact blood bag stock, compatible alternative units, and eligible voluntary donors.
            </p>
        </div>

        <!-- Search Form Card -->
        <div class="card border-0 shadow-sm p-4 mb-4">
            <form id="searchForm" class="row g-3 align-items-end" onsubmit="handleSearch(event)">
                <div class="col-md-5">
                    <label class="form-label fw-bold">Recipient Patient Blood Group</label>
                    <select id="bloodGroupSelect" class="form-select form-select-lg" required>
                        <option value="">-- Choose Blood Group --</option>
                        <option value="1">A+ (A Positive)</option>
                        <option value="2">A- (A Negative)</option>
                        <option value="3">B+ (B Positive)</option>
                        <option value="4">B- (B Negative)</option>
                        <option value="5">AB+ (AB Positive - Universal Recipient)</option>
                        <option value="6">AB- (AB Negative)</option>
                        <option value="7">O+ (O Positive)</option>
                        <option value="8">O- (O Negative - Universal Donor)</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <button type="submit" class="btn btn-danger btn-lg w-100 fw-bold">
                        <i class="bi bi-search me-2"></i>Run Smart Match
                    </button>
                </div>
            </form>
        </div>

        <!-- Search Results Mount -->
        <div id="resultsMount">
            <div class="text-center py-5 text-muted bg-white rounded border">
                <i class="bi bi-droplet-half fs-1 text-danger"></i>
                <h5 class="mt-2 fw-semibold">Select a blood group to calculate clinical compatibility</h5>
                <p class="small text-muted mb-0">Cross-compatibility considers ABO antigen status and Rh factors.</p>
            </div>
        </div>
    </main>

    <div id="footer-mount"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/journey_modal.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const params = new URLSearchParams(window.location.search);
            const bgId = params.get('blood_group_id');
            if (bgId) {
                document.getElementById('bloodGroupSelect').value = bgId;
                runSearch(bgId);
            }
        });

        function handleSearch(e) {
            e.preventDefault();
            const bgId = document.getElementById('bloodGroupSelect').value;
            if (bgId) {
                runSearch(bgId);
            }
        }

        async function runSearch(bloodGroupId) {
            const mount = document.getElementById('resultsMount');
            mount.innerHTML = `
                <div class="text-center py-5">
                    <div class="spinner-border text-danger" role="status"></div>
                    <div class="text-muted mt-2 fw-semibold">Executing Smart Blood Match algorithm...</div>
                </div>
            `;

            try {
                const res = await apiRequest(`search.php?blood_group_id=${bloodGroupId}`);
                const data = res.data;

                const exact = data.exact_matches || [];
                const compatible = data.compatible_alternatives || [];
                const donors = data.eligible_donors || [];

                mount.innerHTML = `
                    <!-- Compatibility Overview Banner -->
                    <div class="alert alert-light border shadow-sm p-4 mb-4">
                        <div class="row align-items-center">
                            <div class="col-md-7">
                                <div class="d-flex align-items-center gap-3">
                                    <span class="badge bg-danger fs-3 px-3 py-2">${data.requested_group.group_name}</span>
                                    <div>
                                        <h5 class="fw-bold mb-1">Compatibility Profile: ${data.requested_group.group_name}</h5>
                                        <div class="small text-muted">
                                            <strong>Accepts Transfusions From:</strong> ${data.compatible_types.join(', ')}
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-5 text-md-end mt-3 mt-md-0">
                                <span class="badge bg-success fs-5 px-3 py-2">${data.total_available_units} Viable Units Available</span>
                                <div class="mt-2">
                                    <a href="new_request.html?blood_group_id=${bloodGroupId}" class="btn btn-outline-danger btn-sm fw-bold">
                                        <i class="bi bi-clipboard-plus me-1"></i>Request Blood
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="row g-4">
                        <!-- Section 1: Exact Matches in Inventory -->
                        <div class="col-lg-6">
                            <div class="card h-100 border shadow-sm">
                                <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                                    <span class="fw-bold text-dark"><i class="bi bi-check-circle-fill text-success me-2"></i>Exact Match Inventory (${exact.length})</span>
                                    <span class="badge bg-success-subtle text-success border">Identical Antigen</span>
                                </div>
                                <div class="card-body p-0">
                                    ${renderBagTable(exact)}
                                </div>
                            </div>
                        </div>

                        <!-- Section 2: Compatible Alternative Units -->
                        <div class="col-lg-6">
                            <div class="card h-100 border shadow-sm">
                                <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                                    <span class="fw-bold text-dark"><i class="bi bi-shuffle text-info me-2"></i>Compatible Alternatives (${compatible.length})</span>
                                    <span class="badge bg-info-subtle text-info border">Clinically Safe</span>
                                </div>
                                <div class="card-body p-0">
                                    ${renderBagTable(compatible)}
                                </div>
                            </div>
                        </div>

                        <!-- Section 3: Eligible Voluntary Donors -->
                        <div class="col-12">
                            <div class="card border shadow-sm">
                                <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                                    <span class="fw-bold text-dark"><i class="bi bi-people-fill text-danger me-2"></i>Eligible Voluntary Donors on Standby (${donors.length})</span>
                                    <span class="badge bg-danger-subtle text-danger border">90-Day Cooldown Cleared</span>
                                </div>
                                <div class="card-body p-0">
                                    ${renderDonorTable(donors)}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            } catch (e) {
                mount.innerHTML = `<div class="alert alert-danger">${e.message}</div>`;
            }
        }

        function renderBagTable(bags) {
            if (!bags || bags.length === 0) {
                return `<div class="p-4 text-center text-muted small">No viable units currently in cold storage.</div>`;
            }
            return `
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0 small">
                        <thead class="table-light">
                            <tr>
                                <th>Serial Code</th>
                                <th>Group</th>
                                <th>Location</th>
                                <th>Expiry</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${bags.map(b => `
                                <tr>
                                    <td>
                                        <span class="badge bg-light text-dark border barcode-badge" onclick="openJourneyModal('${b.bag_code}')">
                                            ${b.bag_code}
                                        </span>
                                    </td>
                                    <td><span class="badge bg-dark">${b.blood_group}</span></td>
                                    <td>${b.storage_location}</td>
                                    <td>
                                        <span class="${b.days_left <= 7 ? 'text-danger fw-bold' : 'text-muted'}">
                                            ${b.expiry_date} (${b.days_left}d left)
                                        </span>
                                    </td>
                                    <td>
                                        <button class="btn btn-outline-secondary btn-sm py-0 px-2" onclick="openJourneyModal('${b.bag_code}')">
                                            <i class="bi bi-arrow-repeat me-1"></i>Trace
                                        </button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function renderDonorTable(donors) {
            if (!donors || donors.length === 0) {
                return `<div class="p-4 text-center text-muted small">No eligible donors currently on standby for this blood group.</div>`;
            }
            return `
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0 small">
                        <thead class="table-light">
                            <tr>
                                <th>Donor Name</th>
                                <th>Group</th>
                                <th>City</th>
                                <th>Phone</th>
                                <th>Last Donation</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${donors.map(d => `
                                <tr>
                                    <td class="fw-semibold">${d.full_name}</td>
                                    <td><span class="badge bg-danger">${d.blood_group}</span></td>
                                    <td>${d.city}</td>
                                    <td><a href="tel:${d.phone}" class="text-decoration-none">${d.phone}</a></td>
                                    <td>${d.last_donation_date || 'First-time Donor'}</td>
                                    <td><span class="badge bg-success">Ready to Donate</span></td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }
    </script>
</body>
</html>
