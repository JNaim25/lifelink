<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Blood Requisition | LifeLink</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/custom.css">
</head>
<body class="d-flex flex-column min-vh-100">

    <div id="navbar-mount"></div>

    <main class="container py-4 flex-grow-1">
        <div class="d-flex align-items-center gap-2 mb-3">
            <span class="badge bg-danger p-2 fs-5 pulsing-badge"><i class="bi bi-lightning-charge-fill"></i></span>
            <div>
                <h2 class="fw-bold mb-0 text-danger">Emergency Blood Requisition</h2>
                <p class="text-muted mb-0">Feature 2: Critical Blood Broadcast & Live Triage Queue</p>
            </div>
        </div>

        <div class="row g-4">
            <!-- Left Column: Rapid Emergency Requisition Ticket Form -->
            <div class="col-lg-5">
                <div class="card border-danger shadow-sm">
                    <div class="card-header bg-danger text-white py-3">
                        <h5 class="fw-bold mb-0"><i class="bi bi-broadcast me-2"></i>Instant Broadcast Requisition</h5>
                        <div class="small opacity-75">Bypasses standard scheduling &bull; Alerts blood bank officers immediately</div>
                    </div>
                    <div class="card-body p-4">
                        <form id="emergencyForm" onsubmit="handleEmergencySubmit(event)">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Patient Full Name <span class="text-danger">*</span></label>
                                <input type="text" id="patientName" class="form-control" placeholder="e.g. John Doe (ICU)" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Hospital Name & Ward <span class="text-danger">*</span></label>
                                <input type="text" id="hospitalName" class="form-control" placeholder="e.g. Dhaka Medical College Hospital - ICU 3" required>
                            </div>

                            <div class="row g-2 mb-3">
                                <div class="col-md-7">
                                    <label class="form-label fw-bold">Blood Group <span class="text-danger">*</span></label>
                                    <select id="bloodGroupId" class="form-select" required>
                                        <option value="">-- Choose Group --</option>
                                        <option value="1">A+</option>
                                        <option value="2">A-</option>
                                        <option value="3">B+</option>
                                        <option value="4">B-</option>
                                        <option value="5">AB+</option>
                                        <option value="6">AB-</option>
                                        <option value="7">O+</option>
                                        <option value="8">O-</option>
                                    </select>
                                </div>
                                <div class="col-md-5">
                                    <label class="form-label fw-bold">Units Needed <span class="text-danger">*</span></label>
                                    <input type="number" id="unitsRequested" class="form-control" min="1" max="10" value="2" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Emergency Attendant Phone <span class="text-danger">*</span></label>
                                <input type="tel" id="contactPhone" class="form-control" placeholder="+880 1711-000000" required>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold">Clinical Diagnosis / Urgency Reason</label>
                                <textarea id="reason" class="form-control" rows="2" placeholder="e.g. Acute trauma bleeding / Emergency cesarean"></textarea>
                            </div>

                            <button type="submit" id="submitBtn" class="btn btn-danger btn-lg w-100 fw-bold shadow">
                                <i class="bi bi-broadcast-pin me-2"></i>Broadcast Emergency Request
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Right Column: Live Triage Queue (view_emergency_queue) -->
            <div class="col-lg-7">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                        <div class="d-flex align-items-center gap-2">
                            <i class="bi bi-clock-history text-danger"></i>
                            <h5 class="fw-bold mb-0">Active Emergency Triage Queue</h5>
                        </div>
                        <button class="btn btn-outline-secondary btn-sm" onclick="loadEmergencyQueue()">
                            <i class="bi bi-arrow-clockwise me-1"></i>Refresh
                        </button>
                    </div>
                    <div class="card-body p-0" id="queueMount">
                        <div class="text-center py-5">
                            <div class="spinner-border text-danger" role="status"></div>
                            <div class="text-muted mt-2">Loading emergency triage queue...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-mount"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/navbar.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            loadEmergencyQueue();
            // Polling every 15 seconds for emergency updates
            setInterval(loadEmergencyQueue, 15000);
        });

        async function loadEmergencyQueue() {
            const mount = document.getElementById('queueMount');
            try {
                const res = await apiRequest('emergency.php');
                const queue = res.data || [];

                if (queue.length === 0) {
                    mount.innerHTML = `
                        <div class="text-center py-5 text-muted">
                            <i class="bi bi-shield-check text-success fs-1"></i>
                            <h6 class="mt-2 fw-bold">Emergency Queue Clear</h6>
                            <p class="small text-muted mb-0">No active emergency requisitions currently pending triage.</p>
                        </div>
                    `;
                    return;
                }

                mount.innerHTML = `
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0 small">
                            <thead class="table-light">
                                <tr>
                                    <th>Priority</th>
                                    <th>Patient / Hospital</th>
                                    <th>Group</th>
                                    <th>Units</th>
                                    <th>Requested</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${queue.map(item => `
                                    <tr class="${item.urgency === 'EMERGENCY' ? 'table-danger' : ''}">
                                        <td>
                                            <span class="badge ${item.urgency === 'EMERGENCY' ? 'bg-danger pulsing-badge' : 'bg-warning text-dark'}">
                                                ${item.urgency}
                                            </span>
                                        </td>
                                        <td>
                                            <div class="fw-bold">${item.patient_name}</div>
                                            <div class="text-muted" style="font-size: 0.75rem;">${item.hospital_name}</div>
                                        </td>
                                        <td><span class="badge bg-dark fs-6">${item.blood_group}</span></td>
                                        <td class="fw-bold">${item.units_requested}</td>
                                        <td>
                                            <div>${item.request_date}</div>
                                            <div class="text-muted" style="font-size: 0.75rem;">${item.time_elapsed_minutes !== null ? item.time_elapsed_minutes + ' min ago' : ''}</div>
                                        </td>
                                        <td><span class="badge bg-secondary">${item.status}</span></td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            } catch (e) {
                mount.innerHTML = `<div class="p-3 alert alert-danger">${e.message}</div>`;
            }
        }

        async function handleEmergencySubmit(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Broadcasting...`;

            const payload = {
                patient_name: document.getElementById('patientName').value.trim(),
                hospital_name: document.getElementById('hospitalName').value.trim(),
                blood_group_id: document.getElementById('bloodGroupId').value,
                units_requested: document.getElementById('unitsRequested').value,
                contact_phone: document.getElementById('contactPhone').value.trim(),
                reason: document.getElementById('reason').value.trim()
            };

            try {
                const res = await apiRequest('emergency.php', 'POST', payload);
                showToast(res.message, 'success');
                document.getElementById('emergencyForm').reset();
                loadEmergencyQueue();
            } catch (err) {
                showToast(err.message, 'danger');
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="bi bi-broadcast-pin me-2"></i>Broadcast Emergency Request`;
            }
        }
    </script>
</body>
</html>
