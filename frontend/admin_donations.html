<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donation Sessions & Intake | LifeLink</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/custom.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <div id="navbar-mount"></div>

    <main class="container-fluid px-lg-4 py-4 flex-grow-1">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
                <h2 class="fw-bold mb-0 text-dark"><i class="bi bi-droplet-fill text-danger me-2"></i>Donation Sessions & Blood Intake</h2>
                <p class="text-muted mb-0">Record clinical intake sessions; system automatically generates serialized inventory bags and updates cooldown</p>
            </div>
            <button class="btn btn-danger fw-bold shadow-sm" data-bs-toggle="modal" data-bs-target="#newSessionModal">
                <i class="bi bi-plus-circle me-1"></i>Record Intake Session
            </button>
        </div>

        <div class="card border-0 shadow-sm bg-white">
            <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                <h5 class="fw-bold mb-0">Completed Intake Sessions</h5>
                <button class="btn btn-outline-secondary btn-sm" onclick="loadDonations()">
                    <i class="bi bi-arrow-clockwise me-1"></i>Refresh
                </button>
            </div>
            <div class="card-body p-0" id="donationsMount">
                <div class="text-center py-5">
                    <div class="spinner-border text-danger" role="status"></div>
                    <div class="text-muted mt-2">Loading donation sessions...</div>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal: Record Donation Session -->
    <div class="modal fade" id="newSessionModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title fw-bold"><i class="bi bi-heart-pulse-fill me-2"></i>Record Clinical Intake Session</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="sessionForm" onsubmit="handleSessionSubmit(event)">
                    <div class="modal-body p-4">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Select Registered Donor <span class="text-danger">*</span></label>
                            <select id="donorSelect" class="form-select" required>
                                <option value="">Loading donor directory...</option>
                            </select>
                        </div>

                        <div class="row g-2 mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Blood Pressure (mmHg) <span class="text-danger">*</span></label>
                                <input type="text" id="bp" class="form-control" value="120/80" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Hemoglobin (g/dL) <span class="text-danger">*</span></label>
                                <input type="number" step="0.1" id="hb" class="form-control" value="14.2" min="12.0" max="18.0" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Target Cold Storage Vault <span class="text-danger">*</span></label>
                            <input type="text" id="storageLocation" class="form-control" value="Cold Vault 1 / Shelf A1" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Clinical Staff Remarks</label>
                            <textarea id="remarks" class="form-control" rows="2" placeholder="Standard whole blood donation; vitals normal."></textarea>
                        </div>
                    </div>
                    <div class="modal-footer bg-light">
                        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" id="saveSessionBtn" class="btn btn-danger fw-bold">
                            <i class="bi bi-check2-circle me-1"></i>Commit & Spawn Blood Bag
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div id="footer-mount"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/journey_modal.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            loadDonations();
            loadDonorsDropdown();
        });

        async function loadDonorsDropdown() {
            const select = document.getElementById('donorSelect');
            try {
                const res = await apiRequest('donors.php?action=list');
                const list = res.data || [];
                select.innerHTML = `<option value="">-- Choose Voluntary Donor --</option>` + 
                    list.map(d => `<option value="${d.donor_id}">${d.full_name} (${d.blood_group} - ${d.city})</option>`).join('');
            } catch (e) {
                select.innerHTML = `<option value="">Failed to load donors</option>`;
            }
        }

        async function loadDonations() {
            const mount = document.getElementById('donationsMount');
            try {
                const res = await apiRequest('donations.php');
                const list = res.data || [];

                if (list.length === 0) {
                    mount.innerHTML = `<div class="text-center py-5 text-muted small">No completed donation sessions recorded yet.</div>`;
                    return;
                }

                mount.innerHTML = `
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0 small">
                            <thead class="table-light">
                                <tr>
                                    <th># ID</th>
                                    <th>Date</th>
                                    <th>Donor Name</th>
                                    <th>Group</th>
                                    <th>Vitals (BP / Hb)</th>
                                    <th>Generated Bag Code</th>
                                    <th>Remarks</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${list.map(d => `
                                    <tr>
                                        <td class="font-monospace">#DON-${d.donation_id}</td>
                                        <td class="fw-bold">${d.donation_date}</td>
                                        <td>
                                            <div class="fw-semibold">${d.donor_name}</div>
                                            <div class="text-muted" style="font-size: 0.75rem;">${d.donor_phone}</div>
                                        </td>
                                        <td><span class="badge bg-danger fs-6">${d.blood_group}</span></td>
                                        <td>${d.blood_pressure || '120/80'} | ${d.hemoglobin || '14.0'} g/dL</td>
                                        <td>
                                            ${d.bag_code ? `
                                                <span class="badge bg-light text-dark border barcode-badge" onclick="openJourneyModal('${d.bag_code}')">
                                                    ${d.bag_code}
                                                </span>
                                            ` : '<span class="text-muted">Unlinked</span>'}
                                        </td>
                                        <td>${d.remarks || 'Standard'}</td>
                                        <td>
                                            ${d.bag_code ? `
                                                <button class="btn btn-outline-secondary btn-sm py-0 px-2" onclick="openJourneyModal('${d.bag_code}')">
                                                    <i class="bi bi-arrow-repeat me-1"></i>Trace
                                                </button>
                                            ` : '-'}
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            } catch (err) {
                mount.innerHTML = `<div class="p-3 text-danger small">${err.message}</div>`;
            }
        }

        async function handleSessionSubmit(e) {
            e.preventDefault();
            const btn = document.getElementById('saveSessionBtn');
            btn.disabled = true;

            const payload = {
                donor_id: document.getElementById('donorSelect').value,
                blood_pressure: document.getElementById('bp').value.trim(),
                hemoglobin: document.getElementById('hb').value,
                storage_location: document.getElementById('storageLocation').value.trim(),
                remarks: document.getElementById('remarks').value.trim()
            };

            try {
                const res = await apiRequest('donations.php?action=create', 'POST', payload);
                showToast(res.message, 'success');
                bootstrap.Modal.getInstance(document.getElementById('newSessionModal')).hide();
                document.getElementById('sessionForm').reset();
                loadDonations();
            } catch (err) {
                showToast(err.message, 'danger');
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
