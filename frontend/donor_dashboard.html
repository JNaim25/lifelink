<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donor Portal | LifeLink</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/custom.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <div id="navbar-mount"></div>

    <main class="container py-4 flex-grow-1">
        <div id="loadingMount" class="text-center py-5">
            <div class="spinner-border text-danger" role="status"></div>
            <div class="text-muted mt-2 fw-semibold">Loading your donor profile...</div>
        </div>

        <div id="dashboardContent" class="d-none">
            <!-- Header Banner -->
            <div class="card border-0 shadow-sm p-4 mb-4 bg-white">
                <div class="row align-items-center">
                    <div class="col-md-7">
                        <div class="d-flex align-items-center gap-3">
                            <span id="donorBloodBadge" class="badge bg-danger fs-1 px-3 py-2">--</span>
                            <div>
                                <h3 class="fw-bold mb-1" id="donorName">Loading...</h3>
                                <div class="text-muted small" id="donorSubtitle">Donor Profile</div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-5 text-md-end mt-3 mt-md-0">
                        <div class="d-inline-block text-start bg-light p-3 rounded border">
                            <div class="small text-muted text-uppercase fw-bold">Lifetime Impact</div>
                            <div class="fs-4 fw-bold text-dark"><span id="totalDonations">0</span> <span class="fs-6 fw-normal text-muted">Donation Sessions</span></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Feature 5: 90-Day Cooldown Card -->
            <div class="card border-0 shadow-sm p-4 mb-4 bg-white">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div class="d-flex align-items-center gap-2">
                        <i class="bi bi-hourglass-split text-danger fs-4"></i>
                        <h5 class="fw-bold mb-0">90-Day Clinical Rest Interval (Cooldown)</h5>
                    </div>
                    <div id="cooldownBadgeMount"></div>
                </div>

                <div class="progress mb-3" style="height: 12px;" id="cooldownProgressBarContainer">
                    <div id="cooldownProgressBar" class="progress-bar progress-bar-striped progress-bar-animated bg-success" role="progressbar" style="width: 100%"></div>
                </div>

                <div class="d-flex justify-content-between small text-muted">
                    <span><strong>Last Donation:</strong> <span id="lastDonationDate">None</span></span>
                    <span><strong>Next Eligible Date:</strong> <span id="nextEligibleDate">Today</span></span>
                </div>
            </div>

            <!-- Donation History Table -->
            <div class="card border-0 shadow-sm bg-white">
                <div class="card-header bg-white py-3">
                    <h5 class="fw-bold mb-0"><i class="bi bi-clock-history text-danger me-2"></i>My Donation History</h5>
                </div>
                <div class="card-body p-0" id="historyMount">
                    <!-- Loaded dynamically -->
                </div>
            </div>
        </div>
    </main>

    <div id="footer-mount"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/journey_modal.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', loadDonorData);

        async function loadDonorData() {
            try {
                const res = await apiRequest('donations.php');
                if (!res.success) throw new Error(res.message);

                const donor = res.data.donor;
                const donations = res.data.donations || [];

                document.getElementById('donorBloodBadge').innerText = donor.blood_group;
                document.getElementById('donorName').innerText = donor.full_name;
                document.getElementById('donorSubtitle').innerText = `${donor.city} • ${donor.email} • ${donor.phone}`;
                document.getElementById('totalDonations').innerText = donations.length;

                // Render Cooldown
                renderCooldown(donor);

                // Render History
                renderHistory(donations);

                document.getElementById('loadingMount').classList.add('d-none');
                document.getElementById('dashboardContent').classList.remove('d-none');
            } catch (err) {
                document.getElementById('loadingMount').innerHTML = `
                    <div class="alert alert-warning">
                        <h5>Access Required</h5>
                        <p>${err.message}</p>
                        <a href="login.html" class="btn btn-outline-danger btn-sm">Sign In as Donor</a>
                    </div>
                `;
            }
        }

        function renderCooldown(d) {
            const badgeMount = document.getElementById('cooldownBadgeMount');
            const bar = document.getElementById('cooldownProgressBar');
            const lastSpan = document.getElementById('lastDonationDate');
            const nextSpan = document.getElementById('nextEligibleDate');

            lastSpan.innerText = d.last_donation_date || 'No record yet';
            nextSpan.innerText = d.next_eligible_date || 'Eligible Now';

            if (d.is_cooldown_passed) {
                badgeMount.innerHTML = `<span class="badge bg-success fs-6"><i class="bi bi-check-circle me-1"></i>Eligible to Donate</span>`;
                bar.className = 'progress-bar bg-success';
                bar.style.width = '100%';
            } else {
                const daysLeft = d.days_until_eligible || 0;
                const percent = Math.max(5, Math.round(((90 - daysLeft) / 90) * 100));
                badgeMount.innerHTML = `<span class="badge bg-warning text-dark fs-6"><i class="bi bi-clock me-1"></i>Resting (${daysLeft} days left)</span>`;
                bar.className = 'progress-bar bg-warning';
                bar.style.width = percent + '%';
            }
        }

        function renderHistory(donations) {
            const mount = document.getElementById('historyMount');
            if (donations.length === 0) {
                mount.innerHTML = `
                    <div class="text-center py-5 text-muted">
                        <i class="bi bi-heart fs-1 text-danger"></i>
                        <h6 class="mt-2 fw-semibold">No Donations Logged Yet</h6>
                        <p class="small text-muted mb-0">Visit our center to complete your first blood donation session.</p>
                    </div>
                `;
                return;
            }

            mount.innerHTML = `
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0 small">
                        <thead class="table-light">
                            <tr>
                                <th>#</th>
                                <th>Donation Date</th>
                                <th>Group</th>
                                <th>Blood Pressure</th>
                                <th>Hemoglobin</th>
                                <th>Remarks</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${donations.map((item, idx) => `
                                <tr>
                                    <td>${idx + 1}</td>
                                    <td class="fw-bold">${item.donation_date}</td>
                                    <td><span class="badge bg-danger">${item.blood_group}</span></td>
                                    <td>${item.blood_pressure || '120/80'}</td>
                                    <td>${item.hemoglobin || '14.0'} g/dL</td>
                                    <td>${item.remarks || 'Standard voluntary donation'}</td>
                                    <td><span class="badge bg-success">Verified</span></td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }
    </script>
</body>
</html>
